<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>

  <body>
    <header>
      <div class="app-name">TODO APP</div>

      <div class="calendar-icon">
        <img src="./icons/Vector.svg" alt="Calendar Icon" />
      </div>
    </header>

    <main>
      <div class="todo-container">
        <!-- <div class="todo-card">
          <div class="todo-details">
            <p class="todo-title">Todo Title</p>
            <p class="todo-caption">Todo caption</p>

          <div class="todo-buttons">
            <button
              class="delete-button"

            >
              <img src="./icons/delete.svg" alt="" />
            </button>

            <button class="edit-button" type="button" aria-label="Edit Todo">

      </div>
      <section class="new-todo-modal">
        <div class="new-todo-header">
          <button class="back-page-button">
            <img
              src="./icons/Turn BackPage Button.svg"
              alt="Turn BackPage Button"
            />
          </button>
          <p>Add Task</p>
        </div>
        <div class="new-todo-editor">
          <div class="new-todo-inputs">
            <input
              type="text"
              class="new-todo-title"
              placeholder="Title"
              maxlength="50"
            />
            <p class="title-counter">50 characters remaining</p>

            <input
              type="text"
              class="new-todo-detail"
              placeholder="Detail"
              maxlength="120"
            />
            <p class="detail-counter">300 characters remaining</p>
          </div>
          <button class="new-todo-add-button">Add</button>
        </div>
      </section>
      <section class="edit-todo-modal">
        <div class="edit-todo-header">
          <button class="back-page-button">
            <img
              src="./icons/Turn BackPage Button.svg"
              alt="Turn BackPage Button"
            />
          </button>
          <p>Edit Task</p>
        </div>
        <div class="edit-todo-editor">
          <div class="edit-todo-inputs">
            <input
              type="text"
              class="edit-todo-title"
              placeholder="Title"
              maxlength="50"
            />
            <p class="edit-title-counter">50 characters remaining</p>

            <input
              type="text"
              class="edit-todo-detail"
              placeholder="Detail"
              maxlength="120"
            />
            <p class="edit-detail-counter">120 characters remaining</p>
          </div>
          <div class="edit-todo-buttons">
            <button class="edit-todo-update-button">Update</button>
            <button class="edit-todo-cancel-button">Cancel</button>
          </div>
        </div>
      </section>
      <section class="completed-todo-modal">
        <div class="completed-todo-header">
          <button class="back-page-button">
            <img
              src="./icons/Turn BackPage Button.svg"
              alt="Turn BackPage Button"
            />
          </button>
          <p>Completed Task</p>
        </div>
        <div class="complete-todo-container"></div>
      </section>
      <button class="add-button" type="button" aria-label="Add Todo">
        <img src="./icons/primary.svg" alt="" class="plus-icon" />
      </button>
    </main>

    <footer>

            fill="#9395D3"
          />
        </svg>

        <span>All</span>
      </button>

      <button class="complete-todo-button" type="button">
        <svg
          width="19"
          height="13"
          viewBox="0 0 19 13"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0.75 6.375L6.58375 12L18.25 0.75"
            stroke="#9395D3"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>Complete</span>
      </button>
    </footer>

    <script src="./app/app.js"></script>
